services:
  postgres:
    image: postgres:16
    container_name: clinicflow-postgres
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: clinicflow

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend

    container_name: clinicflow-backend

    restart: always

    ports:
      - "5000:5000"

    environment:
      PORT: 5000

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: clinicflow
      DB_USER: postgres
      DB_PASSWORD: password

      JWT_SECRET: clinicflow_secret

    depends_on:
      - postgres

    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend

    container_name: clinicflow-frontend

    restart: always

    ports:
      - "5173:5173"

    depends_on:
      - backend

    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
